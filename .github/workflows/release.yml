name: Release

# release-please tient à jour une PR de release (bump de package.json +
# CHANGELOG.md) à partir des titres de PR conventional commits mergés sur
# main. Merger cette PR crée la release GitHub en draft + le tag, puis le job
# build-windows y attache les .exe/latest.yml et la publie.
#
# Tout est dans un seul workflow : un tag créé avec GITHUB_TOKEN ne déclenche
# aucun autre workflow (limitation GitHub), un release.yml "on: push: tags"
# séparé ne partirait donc jamais.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    env:
      # Vide si le secret n'existe pas : l'étape VirusTotal est alors sautée
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Le push déclencheur est sur main (pas sur un tag) : sans
      # `--publish always`, electron-builder ne publierait pas. Il réutilise
      # la release draft créée par release-please (même tag v<version>).
      - name: Build & upload to draft release
        run: yarn build --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Confiance : l'exe n'est pas signé, on publie son empreinte et un scan
      # VirusTotal pour que l'utilisateur puisse vérifier son téléchargement.
      # VirusTotal ne tourne que si le secret VT_API_KEY existe (clé gratuite
      # sur virustotal.com) et ne bloque jamais la release (continue-on-error).
      - name: VirusTotal scan
        id: virustotal
        if: ${{ env.VT_API_KEY != '' }}
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/*.exe

      - name: Add SHA256 and VirusTotal links to release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          {
            gh release view "$tag" --json body -q .body
            echo
            echo "### Verify your download"
            echo
            echo "SHA256 (PowerShell: \`Get-FileHash <file> -Algorithm SHA256\`):"
            echo
            echo '```'
            (cd dist && sha256sum *.exe)
            echo '```'
            # Sortie de l'action : "fichier=url,fichier=url"
            if [ -n "$VT_ANALYSIS" ]; then
              echo
              echo "VirusTotal:"
              echo "$VT_ANALYSIS" | tr ',' '\n' | while IFS='=' read -r file url; do
                echo "- [$(basename "$file")]($url)"
              done
            fi
          } > release-notes.md
          gh release edit "$tag" --notes-file release-notes.md

      # Publiée seulement une fois tous les assets en ligne : l'auto-updater
      # ne voit jamais une release sans latest.yml.
      # Retry : l'API GitHub renvoie parfois un 5xx passager (vécu en 0.1.1,
      # HTTP 502 → release restée en draft alors que le build était OK).
      # L'édition est idempotente, on peut la rejouer sans risque.
      - name: Publish release
        shell: bash
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          for attempt in 1 2 3 4 5; do
            if gh release edit "$tag" --draft=false --latest; then exit 0; fi
            echo "Attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: dist/*.exe
