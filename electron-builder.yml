# appId conservé tel quel depuis le rebrand ServerForge → Nexum : le changer
# ferait installer Nexum À CÔTÉ de ServerForge au lieu de le mettre à jour.
appId: com.serverforge.app
productName: Nexum
directories:
  buildResources: resources
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
# resources/ est le dossier buildResources : electron-builder ne l'embarque
# PAS dans l'app. L'icône de la zone de notification est donc copiée à part,
# lue via process.resourcesPath (voir main/tray/AppTray.ts).
extraResources:
  - from: resources/icon.ico
    to: icon.ico
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: nexum
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Le désinstalleur (lancé aussi à chaque mise à jour) ne supprime que les
  # fichiers de Nexum, jamais ceux que l'utilisateur a rangés dans le dossier.
  include: resources/installer.nsh
portable:
  artifactName: ${name}-${version}-portable.${ext}
publish:
  provider: github
  # release-please crée la release en draft (release-please-config.json) :
  # electron-builder y attache les assets (il réutilise toujours un draft
  # existant pour le tag), puis release.yml la publie. "draft" ici garantit
  # qu'aucun build ne publie jamais une release visible par lui-même.
  releaseType: draft
